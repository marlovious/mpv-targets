[workspace]
members = ["crates/mpv-targets", "crates/mpv-targetsd", "crates/deploy-targets", "crates/targets"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/mpv-targets"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "0.8.23"
tokio = "1.53.1"
futures-util = "0.3.34"
tokio-rustls = "0.26.4"
tokio-tungstenite = "0.26.2"
rustls = "0.23.43"
rustls-pemfile = "2.2.0"
rcgen = "0.13.2"
